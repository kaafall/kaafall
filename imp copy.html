<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    
    <link rel="icon" type="image/png" href="/images/iconfav.png">






<div id="kf-footer-placeholder"></div>
<script>
  fetch('/footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('kf-footer-placeholder').innerHTML = html;
    })
    .catch(err => console.error('Footer load nahi hua:', err));
</script>




<div id="header"></div> 
<script>
  fetch('/header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header').innerHTML = html;
      document.getElementById('header').querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
